<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rental Finder</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fa;
            color: #232d37;
        }

        header {
            background: #232d37;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .search-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #d2d7dc;
            border-radius: 6px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .search-button {
            background: #28965a;
            color: white;
        }

        .clear-button {
            background: #ddd;
            margin-left: 10px;
        }

        .results {
            margin-top: 30px;
        }

        .property {
    background: white;
    margin-bottom: 25px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.property:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
}

.property-content {
    padding: 22px;
}

.property-image {
    width: 100%;
    height: 260px;
    object-fit: cover;
    display: block;
}

.property h3 {
    margin-top: 0;
    margin-bottom: 8px;
    font-size: 22px;
}

.property-location {
    color: #555;
    margin-bottom: 12px;
}

.rent {
    font-size: 24px;
    font-weight: bold;
    margin: 12px 0;
}

.features {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 15px 0;
}

.feature {
    background: #f5f7fa;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
}

.property-description {
    color: #555;
    line-height: 1.5;
}

.details-button {
    background: #232d37;
    color: white;
    width: 100%;
    margin-top: 15px;
}

        .property h3 {
            margin-top: 0;
        }

        .rent {
            font-size: 20px;
            font-weight: bold;
        }

        .features {
            margin: 10px 0;
        }

        .details-button {
            background: #232d37;
            color: white;
        }

        @media (max-width: 700px) {

            .search-grid {
                grid-template-columns: 1fr;
            }

        }
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    overflow-y: auto;
}

.modal-content {
    background: white;
    width: 90%;
    max-width: 700px;
    margin: 40px auto;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.25);
}

.modal-image {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
}

.modal-body {
    padding: 25px;
}

.modal-body h2 {
    margin-top: 0;
}

.modal-rent {
    font-size: 24px;
    font-weight: bold;
}

.modal-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
}

.modal-detail {
    background: #f5f7fa;
    padding: 12px;
    border-radius: 6px;
}

.close-modal {
    background: #232d37;
    color: white;
    width: 100%;
}

@media (max-width: 600px) {

    .modal-details {
        grid-template-columns: 1fr;
    }

}

    </style>

</head>

<body>

<header>

    <h1>🏠 Rental Finder</h1>

    <p>Find a rental property that fits your needs</p>

</header>


<div class="container">

    <div class="search-box">

        <h2>Search Properties</h2>

        <div class="search-grid">

            <div>

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="e.g. Kianyaga"
                >

            </div>


            <div>

                <label for="rent">
                    Maximum Rent
                </label>

                <input
                    type="number"
                    id="rent"
                    placeholder="e.g. 15000"
                >

            </div>


            <div>

                <label for="bedrooms">
                    Bedrooms
                </label>

                <select id="bedrooms">

                    <option value="Any">
                        Any
                    </option>

                    <option value="0">
                        Bedsitter
                    </option>

                    <option value="1">
                        1 Bedroom
                    </option>

                    <option value="2">
                        2 Bedrooms
                    </option>

                    <option value="3">
                        3 Bedrooms
                    </option>

                </select>

            </div>


            <div>

                <label for="water">
                    Water
                </label>

                <select id="water">

                    <option value="Any">
                        Any
                    </option>

                    <option value="Yes">
                        Yes
                    </option>

                    <option value="No">
                        No
                    </option>

                </select>

            </div>


            <div>

                <label for="parking">
                    Parking
                </label>

                <select id="parking">

                    <option value="Any">
                        Any
                    </option>

                    <option value="Yes">
                        Yes
                    </option>

                    <option value="No">
                        No
                    </option>

                </select>

            </div>


            <div>

                <label for="sort">
                    Sort By
                </label>

                <select id="sort">

                    <option value="1">
                        Rent: Low to High
                    </option>

                    <option value="2">
                        Rent: High to Low
                    </option>

                    <option value="3">
                        Distance to Town
                    </option>

                </select>

            </div>

        </div>


        <button
            class="search-button"
            onclick="searchProperties()"
        >
            SEARCH
        </button>


        <button
            class="clear-button"
            onclick="clearSearch()"
        >
            CLEAR
        </button>

    </div>


    <div class="results">

        <h2>Available Properties</h2>

        <div id="results">

            <p>
                Enter your search criteria and click SEARCH.
            </p>

        </div>

    </div>

</div>

<div id="propertyModal" class="modal">

    <div class="modal-content">

        <img
            id="modalImage"
            class="modal-image"
            src=""
            alt="Property image"
        >

        <div class="modal-body">

            <h2 id="modalType"></h2>

            <p id="modalLocation"></p>

            <p id="modalRent" class="modal-rent"></p>

            <div class="modal-details">

                <div class="modal-detail">
                    🛏️ Bedrooms:
                    <strong id="modalBedrooms"></strong>
                </div>

                <div class="modal-detail">
                    🚿 Bathrooms:
                    <strong id="modalBathrooms"></strong>
                </div>

                <div class="modal-detail">
                    💧 Water:
                    <strong id="modalWater"></strong>
                </div>

                <div class="modal-detail">
                    🚗 Parking:
                    <strong id="modalParking"></strong>
                </div>

                <div class="modal-detail">
                    🔐 Security:
                    <strong id="modalSecurity"></strong>
                </div>

                <div class="modal-detail">
                    🪑 Furnished:
                    <strong id="modalFurnished"></strong>
                </div>

                <div class="modal-detail">
                    📍 Distance:
                    <strong id="modalDistance"></strong>
                </div>

                <div class="modal-detail">
                    📞 Contact:
                    <strong id="modalPhone"></strong>
                </div>

            </div>

            <p id="modalDescription"></p>

            <button
                class="close-modal"
                onclick="closeDetails()"
            >
                CLOSE
            </button>

        </div>

    </div>

</div>

<script>

async function searchProperties() {

    const location =
        document.getElementById("location").value;

    const rent =
        document.getElementById("rent").value;

    const bedrooms =
        document.getElementById("bedrooms").value;

    const water =
        document.getElementById("water").value;

    const parking =
        document.getElementById("parking").value;

    const sort =
        document.getElementById("sort").value;


    if (rent === "") {

        alert("Please enter maximum rent.");

        return;

    }


    document.getElementById("results").innerHTML =
        "<p>Searching properties...</p>";


    const params = new URLSearchParams({

        location: location || "Any",

        max_rent: rent,

        bedrooms: bedrooms,

        water: water,

        parking: parking,

        sort: sort

    });


    try {

        const response =
            await fetch("/search?" + params.toString());


        const properties =
            await response.json();


        if (properties.error) {

            document.getElementById("results").innerHTML =
                "<p>" + properties.error + "</p>";

            return;

        }


        if (properties.length === 0) {

            document.getElementById("results").innerHTML =
                "<p>No properties found.</p>";

            return;

        }


        let html = "";


        properties.forEach(property => {

    let imageHtml = "";

    if (property.image && property.image !== "No image") {

        imageHtml = `
            <img
                class="property-image"
                src="/images/${property.image}"
                alt="${property.type}"
            >
        `;

    }

    html += `

        <div class="property">

            ${imageHtml}

            <div class="property-content">

                <h3>
                    ${property.type}
                </h3>

                <p class="property-location">
                    📍 ${property.location} • ${property.estate}
                </p>

                <p class="rent">
                    KSh ${property.rent} / month
                </p>

                <div class="features">

                    <span class="feature">
                        🛏️ ${property.bedrooms} Bedrooms
                    </span>

                    <span class="feature">
                        🚿 ${property.bathrooms} Bathrooms
                    </span>

                    <span class="feature">
                        💧 Water: ${property.water}
                    </span>

                    <span class="feature">
                        🚗 Parking: ${property.parking}
                    </span>

                </div>

                <p class="property-description">
                    ${property.description}
                </p>

                <button
                    class="details-button"
                    onclick='showDetails(${JSON.stringify(property)})'
                >
                    VIEW DETAILS
                </button>

            </div>

        </div>

    `;

});


        document.getElementById("results").innerHTML =
            html;


    } catch (error) {

        document.getElementById("results").innerHTML =

            "<p>Could not connect to the Rental Finder server.</p>";

        console.error(error);

    }

}


function showDetails(property) {

    document.getElementById("modalType").textContent =
        property.type;

    document.getElementById("modalLocation").textContent =
        property.location + " • " + property.estate;

    document.getElementById("modalRent").textContent =
        "Ksh " + property.rent;

    document.getElementById("modalBedrooms").textContent =
        property.bedrooms;

    document.getElementById("modalBathrooms").textContent =
        property.bathrooms;

    document.getElementById("modalWater").textContent =
        property.water;

    document.getElementById("modalParking").textContent =
        property.parking;

    document.getElementById("modalSecurity").textContent =
        property.security;

    document.getElementById("modalFurnished").textContent =
        property.furnished;

    document.getElementById("modalDistance").textContent =
        property.distance_to_town;

    document.getElementById("modalPhone").textContent =
        property.phone;

    document.getElementById("modalDescription").textContent =
        property.description;


    const modalImage =
        document.getElementById("modalImage");


    if (
        property.image &&
        property.image !== "No image"
    ) {

        modalImage.src =
            "/images/" + property.image;

        modalImage.style.display =
            "block";

    } else {

        modalImage.style.display =
            "none";

    }


    document.getElementById("propertyModal").style.display =
        "block";
}


function closeDetails() {

    document.getElementById("propertyModal").style.display =
        "none";

}

function clearSearch() {

    document.getElementById("location").value = "";

    document.getElementById("rent").value = "";

    document.getElementById("bedrooms").value = "Any";

    document.getElementById("water").value = "Any";

    document.getElementById("parking").value = "Any";

    document.getElementById("sort").value = "1";


    document.getElementById("results").innerHTML =

        "<p>Enter your search criteria and click SEARCH.</p>";

}

</script>
</body>

</html>
